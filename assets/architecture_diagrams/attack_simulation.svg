<rect width="100%" height="100%" rx="28" fill="#fbf7fa"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#38243a">Attack Simulation</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="14" fill="#725d74">Three demonstrations and the expected security outcome</text><g filter="url(#shadow)"><rect x="50" y="150" width="195" height="86" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="64" y="163" width="7" height="60" rx="4" fill="#d85b98"/><text x="84" y="184" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Client</text><text x="84" y="207" font-family="Arial" font-size="11" fill="#725d74">Creates protected packet</text></g><g filter="url(#shadow)"><rect x="390" y="150" width="230" height="86" rx="16" fill="#fff2d9" stroke="#eadbe6"/><rect x="404" y="163" width="7" height="60" rx="4" fill="#d85b98"/><text x="424" y="184" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Network observation</text><text x="424" y="207" font-family="Arial" font-size="11" fill="#725d74">Attacker can see TCP traffic</text></g><g filter="url(#shadow)"><rect x="795" y="150" width="205" height="86" rx="16" fill="#e6f4ef" stroke="#eadbe6"/><rect x="809" y="163" width="7" height="60" rx="4" fill="#d85b98"/><text x="829" y="184" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Server</text><text x="829" y="207" font-family="Arial" font-size="11" fill="#725d74">Verifies before delivery</text></g><path d="M245 193 L390 193" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="317.5" y="185.0" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#725d74">encrypted packet</text><path d="M620 193 L795 193" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="707.5" y="185.0" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#725d74">forward / modify / replay</text><g filter="url(#shadow)"><rect x="70" y="315" width="250" height="90" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="84" y="328" width="7" height="64" rx="4" fill="#d85b98"/><text x="104" y="349" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Eavesdropping</text><text x="104" y="372" font-family="Arial" font-size="11" fill="#725d74">Captured ciphertext · plaintext stays hidden</text></g><g filter="url(#shadow)"><rect x="405" y="315" width="250" height="90" rx="16" fill="#fde8e8" stroke="#eadbe6"/><rect x="419" y="328" width="7" height="64" rx="4" fill="#d85b98"/><text x="439" y="349" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Tampering</text><text x="439" y="372" font-family="Arial" font-size="11" fill="#725d74">Changed bytes · signature or GCM check fails</text></g><g filter="url(#shadow)"><rect x="740" y="315" width="250" height="90" rx="16" fill="#fff2d9" stroke="#eadbe6"/><rect x="754" y="328" width="7" height="64" rx="4" fill="#d85b98"/><text x="774" y="349" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Replay</text><text x="774" y="372" font-family="Arial" font-size="11" fill="#725d74">Old counter · packet rejected</text></g><path d="M505 236 C505 265 195 265 195 315" fill="none" stroke="#b69caf" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M505 236 L530 315" fill="none" stroke="#b69caf" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M505 236 C505 265 865 265 865 315" fill="none" stroke="#b69caf" stroke-width="1.5" stroke-dasharray="5 5"/><text x="50" y="455" font-family="Arial" font-size="11" fill="#725d74">Attack demonstrations follow attacks.py and the client/server verification order.</text></svg>