<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d85b98"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4b2840" flood-opacity=".12"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf7fa"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#38243a">Secure Message Workflow</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="14" fill="#725d74">Client-to-server packet creation and validation</text><g filter="url(#shadow)"><rect x="35" y="145" width="150" height="78" rx="16" fill="#f5e5ef" stroke="#eadbe6"/><rect x="49" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="69" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Authenticate</text><text x="69" y="202" font-family="Arial" font-size="11" fill="#725d74">Username + password</text></g><g filter="url(#shadow)"><rect x="220" y="145" width="165" height="78" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="234" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="254" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">ECDH exchange</text><text x="254" y="202" font-family="Arial" font-size="11" fill="#725d74">SECP256R1 public keys</text></g><g filter="url(#shadow)"><rect x="420" y="145" width="160" height="78" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="434" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="454" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Session key</text><text x="454" y="202" font-family="Arial" font-size="11" fill="#725d74">HKDF-SHA256</text></g><g filter="url(#shadow)"><rect x="615" y="145" width="165" height="78" rx="16" fill="#f5e5ef" stroke="#eadbe6"/><rect x="629" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="649" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Encrypt</text><text x="649" y="202" font-family="Arial" font-size="11" fill="#725d74">AES-256-GCM</text></g><g filter="url(#shadow)"><rect x="815" y="145" width="175" height="78" rx="16" fill="#fff2d9" stroke="#eadbe6"/><rect x="829" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="849" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Sign packet</text><text x="849" y="202" font-family="Arial" font-size="11" fill="#725d74">RSA-PSS / SHA-256</text></g><path d="M185 184 L220 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M385 184 L420 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M580 184 L615 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M780 184 L815 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="800" y="300" width="205" height="78" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="814" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="834" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">TCP packet</text><text x="834" y="357" font-family="Arial" font-size="11" fill="#725d74">Counter · nonce · cipher · sig</text></g><g filter="url(#shadow)"><rect x="615" y="300" width="165" height="78" rx="16" fill="#fff2d9" stroke="#eadbe6"/><rect x="629" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="649" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Verify signature</text><text x="649" y="357" font-family="Arial" font-size="11" fill="#725d74">Client RSA public key</text></g><g filter="url(#shadow)"><rect x="420" y="300" width="160" height="78" rx="16" fill="#fde8e8" stroke="#eadbe6"/><rect x="434" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="454" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Replay check</text><text x="454" y="357" font-family="Arial" font-size="11" fill="#725d74">Reject counter ≤ last</text></g><g filter="url(#shadow)"><rect x="220" y="300" width="165" height="78" rx="16" fill="#e6f4ef" stroke="#eadbe6"/><rect x="234" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="254" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Decrypt</text><text x="254" y="357" font-family="Arial" font-size="11" fill="#725d74">AES-GCM tag check</text></g><g filter="url(#shadow)"><rect x="35" y="300" width="150" height="78" rx="16" fill="#e6f4ef" stroke="#eadbe6"/><rect x="49" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="69" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Accept</text><text x="69" y="357" font-family="Arial" font-size="11" fill="#725d74">Deliver plaintext</text></g><path d="M900 223 L900 300" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M815 339 L780 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M615 339 L580 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M420 339 L385 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M220 339 L185 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="430" font-family="Arial" font-size="11" fill="#725d74">The counter is checked before AES-GCM decryption. Any signature, replay, or authentication-tag failure rejects the packet.</text></svg>