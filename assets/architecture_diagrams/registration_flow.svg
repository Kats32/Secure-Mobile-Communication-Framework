<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d85b98"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#4b2840" flood-opacity=".12"/></filter></defs>
<rect width="100%" height="100%" rx="28" fill="#fbf7fa"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#38243a">Registration &amp; Login</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="14" fill="#725d74">Password storage flow documented for the PySide6 registration interface</text><g filter="url(#shadow)"><rect x="45" y="145" width="185" height="78" rx="16" fill="#f5e5ef" stroke="#eadbe6"/><rect x="59" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="79" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Registration form</text><text x="79" y="202" font-family="Arial" font-size="11" fill="#725d74">Username + password</text></g><g filter="url(#shadow)"><rect x="285" y="145" width="190" height="78" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="299" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="319" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Random salt</text><text x="319" y="202" font-family="Arial" font-size="11" fill="#725d74">16 bytes per account</text></g><g filter="url(#shadow)"><rect x="530" y="145" width="215" height="78" rx="16" fill="#fff2d9" stroke="#eadbe6"/><rect x="544" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="564" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">PBKDF2-HMAC-SHA256</text><text x="564" y="202" font-family="Arial" font-size="11" fill="#725d74">100,000 iterations</text></g><g filter="url(#shadow)"><rect x="800" y="145" width="210" height="78" rx="16" fill="#e6f4ef" stroke="#eadbe6"/><rect x="814" y="158" width="7" height="52" rx="4" fill="#d85b98"/><text x="834" y="179" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Local user record</text><text x="834" y="202" font-family="Arial" font-size="11" fill="#725d74">Store salt + derived hash</text></g><path d="M230 184 L285 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M475 184 L530 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M745 184 L800 184" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="165" y="300" width="230" height="78" rx="16" fill="#f5e5ef" stroke="#eadbe6"/><rect x="179" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="199" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Login form</text><text x="199" y="357" font-family="Arial" font-size="11" fill="#725d74">Enter username + password</text></g><g filter="url(#shadow)"><rect x="470" y="300" width="235" height="78" rx="16" fill="#e8edff" stroke="#eadbe6"/><rect x="484" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="504" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Derive again</text><text x="504" y="357" font-family="Arial" font-size="11" fill="#725d74">Use stored salt + same KDF</text></g><g filter="url(#shadow)"><rect x="780" y="300" width="205" height="78" rx="16" fill="#e6f4ef" stroke="#eadbe6"/><rect x="794" y="313" width="7" height="52" rx="4" fill="#d85b98"/><text x="814" y="334" font-family="Arial" font-size="16" font-weight="700" fill="#38243a">Compare</text><text x="814" y="357" font-family="Arial" font-size="11" fill="#725d74">Accept or reject login</text></g><path d="M395 339 L470 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M705 339 L780 339" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M905 223 L700 300" fill="none" stroke="#d85b98" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="802.5" y="253.5" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#725d74">stored salt + hash</text><text x="45" y="430" font-family="Arial" font-size="11" fill="#725d74">This diagram follows register.py’s GUI flow. auth.py currently uses unsalted SHA-256, so the server login path is not yet aligned.</text></svg>